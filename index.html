<!doctype html>
<html lang="en" data-density="compact">
  <head>
    <!-- data-density="compact" on <html>: an editor is a dense tool worked for hours, and dialogs and menus portal outside the app root, so the density sits where they see it too. -->
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Strata Vid</title>
    <!-- strata-react colorSchemeScript(undefined, "dark"): sets .dark before the first paint, so the editor does not flash light. Regenerate if the default or key changes. -->
    <script>(function(){var p="dark";try{var s=localStorage.getItem("strata-color-scheme");if(s==="system"||s==="light"||s==="dark")p=s}catch(e){}var d=p==="dark"||(p==="system"&&window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches);document.documentElement.classList.toggle("dark",!!d)})()</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
